# Written by `km init`. Validates only the staged .md files, so older frontmatter debt never blocks an
# unrelated commit. Install once: `pre-commit install`. `pre-commit autoupdate --freeze` (or `km upgrade`)
# moves the km version; km is pinned by commit, so a moved tag cannot change what runs.
repos:
  - repo: https://github.com/pasrom/km
    rev: <KM_SHA>  # frozen: <KM_VERSION>
    hooks:
      - id: km-validate
