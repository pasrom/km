# Written by `km init --team`; owned by this repo. Actions are pinned by commit, with the version as a
# comment, so a moved tag cannot change what runs; Dependabot proposes updates, `km upgrade` moves km.
name: staleness

# Weekly: demote accepted docs whose review_by has lapsed back to review, so stale knowledge
# drops out of the served set automatically. Also runnable on demand.
on:
  schedule:
    - cron: '0 6 * * 1'          # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pasrom/km@<KM_SHA> # <KM_VERSION>, installs the km CLI at that commit
      - name: demote stale accepted docs
        run: km demote --apply
      # A doc `km demote` could not rewrite fails that step; still commit the others.
      - name: commit demotions if any
        if: ${{ !cancelled() }}
        run: |
          if ! git diff --quiet; then
            git config user.name "brain-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(ci): demote stale accepted docs to review (review_by lapsed)"
            git push
          else
            echo "nothing to demote"
          fi
      # A push made with GITHUB_TOKEN starts no other workflow, so ci.yml does not rebuild the
      # served bundle after a demotion: rebuild it here, or the demoted doc stays served.
      - name: rebuild served bundle
        if: ${{ !cancelled() }}
        run: km serve
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: served-bundle
          path: dist/served/
          if-no-files-found: warn
      # A demoted doc can leave accepted docs linking to it (a bergab error), and this push starts no
      # CI run: validate here, so a red scheduled run tells the maintainer before the next PR fails.
      - name: validate after demotion
        if: ${{ !cancelled() }}
        run: km validate
