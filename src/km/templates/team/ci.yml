# Written by `km init --team`; owned by this repo. Actions are pinned by commit, with the version as a
# comment, so a moved tag cannot change what runs; Dependabot proposes updates, `km upgrade` moves km.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # full history so source-pin (path.md@hash) checks can see blobs
      - uses: pasrom/km@<KM_SHA> # <KM_VERSION>, installs the km CLI at that commit
      - name: validate frontmatter + gate + index completeness
        run: km validate
      - name: _index Documents list up to date
        run: km gen-index --check
      - name: build served bundle (main only — a PR build is not "served")
        if: github.event_name == 'push'
        run: km serve
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: served-bundle
          path: dist/served/
          if-no-files-found: warn
