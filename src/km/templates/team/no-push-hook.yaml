# Refuses a push to main, where a commit got past no-commit-to-branch: main changes only through a merged
# pull request (CONVENTIONS.md). Runs at pre-push, which `pre-commit install` sets up through
# default_install_hook_types. pre-commit looks at the first ref of a push only and skips a push whose
# commits the remote already has on another ref, so `git push origin main` is refused while a push of
# several refs at once is not; a throwaway clone has no hooks, there the rule holds by itself.
- repo: local
  hooks:
    - id: no-push-to-main
      name: no push to main
      entry: >-
        bash -c 'case "${PRE_COMMIT_REMOTE_BRANCH:-}" in refs/heads/main) echo "main changes only
        through a merged pull request (CONVENTIONS.md): push a branch and open one" >&2; exit 1;; esac'
      language: system
      stages: [pre-push]
      always_run: true
      pass_filenames: false
