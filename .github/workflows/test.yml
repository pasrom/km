name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: git identity for the test repos
        run: git config --global user.name ci && git config --global user.email ci@example.org
      - run: bash skills/km/tests/gate_smoke.sh
      - run: bash skills/km/tests/index_smoke.sh
      - run: bash skills/km/tests/team_smoke.sh
