name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: pip install pyyaml==6.0.3 pre-commit==4.6.2
      - name: the package installs with its templates
        run: |
          python -m venv /tmp/wheel && /tmp/wheel/bin/pip install --quiet . && /tmp/wheel/bin/km --version
          # km init pins a release by its commit: stand this checkout in for a released km
          git tag "v$(/tmp/wheel/bin/km --version)"
          KM_REPO_URL="file://$GITHUB_WORKSPACE" /tmp/wheel/bin/km init /tmp/wheel-brain --team --name W --desc w --initials WW --folder d=D
      - run: bash tests/gate_smoke.sh
      - run: bash tests/index_smoke.sh
      - run: bash tests/pins_smoke.sh
      - run: bash tests/cites_smoke.sh
      - run: bash tests/doctor_smoke.sh
      - name: sync_smoke.sh without uv (the launcher's own fallback)
        run: KM_TEST_UV=forbid bash tests/sync_smoke.sh
      - run: bash tests/list_smoke.sh
      - run: bash tests/signoff_smoke.sh
      - run: bash tests/skill_smoke.sh
      - run: bash tests/hook_smoke.sh
      - run: bash tests/mounted_pins_smoke.sh
      - name: team_smoke.sh, with a Latin-1 locale for its file-name encoding test
        run: sudo localedef -i en_US -f ISO-8859-1 en_US.ISO-8859-1 && bash tests/team_smoke.sh
      # Last, so no other suite sees it: uv for the launcher's cases in sync_smoke (skills/km/bin/km runs
      # km through uv where it is installed); no cache shared across workflow runs
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: sync_smoke.sh with uv
        run: KM_TEST_UV=require bash tests/sync_smoke.sh

  # The composite action a brain's CI uses: install km from this checkout, then build and check a
  # team brain with the installed `km` command.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: plant a venv and a pip package where the action installs km
        run: |
          for m in venv pip; do mkdir "$m" && : > "$m/__init__.py" && printf 'raise SystemExit("planted %s ran")\n' "$m" > "$m/__main__.py"; done
      - uses: ./
      - name: the planted venv and pip did not run (the install above succeeded)
        run: rm -r venv pip
      - name: the job's own python is untouched
        run: python --version | grep -q "3\.12" && ! python -c "import km" 2>/dev/null
      - name: a fresh team brain is clean
        run: |
          km --version
          git tag "v$(km --version)"             # km init pins a release by its commit
          export KM_REPO_URL="file://$GITHUB_WORKSPACE"
          km init "$RUNNER_TEMP/b" --team --name CI-Brain --desc "the CI team" --initials CI --folder docs="Docs"
          cd "$RUNNER_TEMP/b"
          git init -q && git add -A
          km gen-index && git add -A
          km gen-index --check
          km validate
          km serve
      - name: a km/ package or yaml.py in the brain's checkout does not replace km or PyYAML
        working-directory: ${{ runner.temp }}/b
        run: |
          printf 'raise SystemExit("planted yaml ran")\n' > yaml.py
          km validate                      # yaml.py alone: the km found first would import it
          mkdir km && printf 'raise SystemExit("planted km ran")\n' > km/__main__.py && touch km/__init__.py
          km validate
          rm -r km yaml.py
      # the steps a team brain's ci.yml runs, including uploading the served bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: served-bundle
          path: ${{ runner.temp }}/b/dist/served/
          if-no-files-found: error

  # Windows: its default encoding is a code page (cp1252), not UTF-8, and text files are written with
  # CRLF. A file name with an umlaut must still be found, and km must write the LF the repo holds
  # (tests/encoding_smoke.sh).
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install --quiet --disable-pip-version-check pyyaml==6.0.3 pre-commit==4.6.2
      - name: non-ASCII file names and LF writes
        env:
          PYTHON: python
        run: |
          source tests/lib.sh
          windows_like "" || { echo "::error::the runner's encoding is UTF-8, this job tests nothing"; exit 1; }
          with_env "" bash tests/encoding_smoke.sh    # as checked: UTF-8 mode off
      - name: km doctor, km sync and the plugin's edit guard on Windows, without uv (the launcher's own fallback)
        env:
          PYTHON: python
        run: bash tests/doctor_smoke.sh && KM_TEST_UV=forbid bash tests/sync_smoke.sh && bash tests/hook_smoke.sh && bash tests/signoff_smoke.sh
      - name: km validate, the gate, promote, approve and demote on Windows
        env:
          PYTHON: python
        run: bash tests/gate_smoke.sh
      # then the same uv as in smoke, for sync_smoke's launcher cases
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: the launcher through uv on Windows, the path of its pending file included
        env:
          PYTHON: python
        run: KM_TEST_UV=require bash tests/sync_smoke.sh

  # Merging a version bump is the release: once main is green, tag v<__version__> if that tag is new.
  # Brains pin these tags, and `km init` writes the tag of the km that runs it.
  release:
    if: github.event_name == 'push'
    needs: [smoke, action, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: tag the version if it is new
        run: |
          v="v$(PYTHONPATH=src python3 -c 'import km; print(km.__version__)')"
          if git rev-parse -q --verify "refs/tags/$v" >/dev/null; then echo "$v is already tagged"; exit 0; fi
          git tag "$v" && git push origin "$v" && echo "tagged $v"
