name: km
description: Install the km CLI (km validate, km gen-index and the other km commands) at this action's version.
branding:
  icon: book-open
  color: blue
inputs:
  python-version:
    description: Python km runs on, 3.11 or newer (installed for km only; the job's own python is left as it is)
    default: '3.11'
runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
    - name: install km
      shell: bash
      run: bash "${{ github.action_path }}/action/install.sh" "${{ steps.py.outputs.python-path }}"
