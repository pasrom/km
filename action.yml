name: km
description: Install the km CLI (validate, gen-index, demote, serve, promote) at this action's version.
branding:
  icon: book-open
  color: blue
inputs:
  python-version:
    description: Python km runs on, 3.11 or newer (installed for km only; the job's own python is left as it is)
    default: '3.11'
runs:
  using: composite
  steps:
    - id: py
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ inputs.python-version }}
        update-environment: false
    - name: install km
      shell: bash
      run: |
        # km is pure Python: run it from the action's checkout, with only its dependency (pyproject's
        # `dependencies`, same exact version) in a venv of its own; no wheel to build on every job.
        venv="$RUNNER_TEMP/km-venv"
        # -P and PYTHONSAFEPATH keep the working directory (the brain's checkout) off sys.path, for
        # this step and for km and every Python it starts: a `venv/`, `pip/` or `km/` folder or a
        # `yaml.py` in a pull request must not stand in for the module it names
        "${{ steps.py.outputs.python-path }}" -P -m venv "$venv"
        "$venv/bin/python" -P -m pip install --quiet --disable-pip-version-check "pyyaml==6.0.3"
        mkdir -p "$RUNNER_TEMP/km-bin"
        printf '#!/usr/bin/env bash\nPYTHONSAFEPATH=1 PYTHONPATH="%s/src" exec "%s/bin/python" -P -m km "$@"\n' \
          "${{ github.action_path }}" "$venv" > "$RUNNER_TEMP/km-bin/km"
        chmod +x "$RUNNER_TEMP/km-bin/km"
        echo "$RUNNER_TEMP/km-bin" >> "$GITHUB_PATH"
